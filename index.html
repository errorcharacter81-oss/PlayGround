<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070812"><link rel="icon" href="data:,">
<title>LAST BREATH // broken menu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--ink:#080910;--white:#f5f4ed;--cyan:#51e6ff;--red:#ff4d61;--gold:#ffce57}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 34%,#242038 0%,#11111e 42%,#06070d 100%);color:var(--white);font-family:'Press Start 2P',monospace;touch-action:none}
body{display:grid;place-items:center}.shell{width:min(100vw,1280px);padding:16px;position:relative}.frame{position:relative;width:100%;aspect-ratio:16/10;max-height:calc(100dvh - 32px);border:2px solid #525267;background:#06070b;box-shadow:0 0 0 5px #11111b,0 0 50px #000b,0 0 70px #312c5930;overflow:hidden}.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 4px);mix-blend-mode:screen;z-index:4}.topline{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;font-size:clamp(7px,.8vw,10px);color:#9091a6;z-index:5;letter-spacing:1px}.live{color:#ff5969;display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;background:#ff435d;border-radius:50%;box-shadow:0 0 10px #ff435d;animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#747486;font-size:clamp(7px,.75vw,9px);letter-spacing:.4px;z-index:5}.mobile-controls{display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);gap:10px;z-index:6}.mobile-controls button{font:10px 'Press Start 2P';color:white;background:#181824dd;border:1px solid #85859b;border-radius:5px;padding:14px;touch-action:none}@media(max-width:700px){.shell{padding:5px}.frame{max-height:calc(100dvh - 10px)}.topline{top:8px;left:9px;right:9px}.hint{bottom:5px}.mobile-controls{display:flex;bottom:24px}.mobile-controls button{padding:10px;font-size:8px}}
</style>
</head>
<body><main class="shell"><div class="frame"><div class="topline"><span>UNDERGROUND // 09:47 PM</span><span class="live"><i class="dot"></i>SOUL LINK UNSTABLE</span></div><canvas id="game" width="960" height="600" aria-label="Last Breath game"></canvas><div class="hint" id="hint">ENTER / Z TO BEGIN &nbsp; • &nbsp; ARROWS TO MOVE &nbsp; • &nbsp; X TO BACK</div><div class="mobile-controls"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key="z">OK</button></div></div></main>
<script>
(()=>{
const c=document.querySelector('#game'),ctx=c.getContext('2d'),hint=document.querySelector('#hint');
ctx.imageSmoothingEnabled=false;
const W=960,H=600, keys={}, colors={white:'#f4f2e9',gray:'#9292a2',dark:'#080910',cyan:'#51e6ff',red:'#ff4d61',gold:'#ffce57',blue:'#4b79ff'};
let mode='title',tick=0,dialogue=0,menu=0,hp=20,maxHp=20,turn=0,phase=1,attackTimer=0,attackTarget=0,attackResult=0,invuln=0,arena={x:225,y:290,w:510,h:206},heart={x:480,y:390},bullets=[],bones=[],fragments=[],collected=0,restoreTimer=0,shake=0,flash=0,ending=0,score=0,playTime=0;
const lines=["heya. you made it all this way.","i'm impressed. really.","let's see if you can keep it up."];
function text(str,x,y,size=12,color=colors.white,align='left'){ctx.fillStyle=color;ctx.font=`${size}px 'Press Start 2P', monospace`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(str,x,y)}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function box(x,y,w,h,border='#f4f2e9',fill='#080910',line=4){rect(x,y,w,h,fill);rect(x,y,w,line,border);rect(x,y+h-line,w,line,border);rect(x,y,line,h,border);rect(x+w-line,y,line,h,border)}
function glow(x,y,r,color,a=1){ctx.save();ctx.globalAlpha=a;ctx.shadowColor=color;ctx.shadowBlur=r;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawSans(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
// shadow
rect(-30,34,60,8,'#0008');
// skull silhouette
rect(-27,-24,54,49,'#eeeae0');rect(-33,-14,8,24,'#eeeae0');rect(25,-14,8,24,'#eeeae0');rect(-20,-31,40,9,'#eeeae0');
// eye sockets
rect(-18,-9,12,12,'#13131b');rect(7,-9,12,12,'#13131b');rect(-15,-6,5,5,'#fff');rect(10,-6,5,5,'#fff');
// grin
rect(-17,11,34,4,'#27252b');for(let i=-12;i<=12;i+=8)rect(i,11,3,6,'#eeeae0');
// jacket / bones
rect(-25,26,50,37,'#242b4c');rect(-33,30,8,30,'#30385a');rect(25,30,8,30,'#30385a');rect(-19,25,38,7,'#ebebdf');rect(-6,29,12,9,'#ba283b');rect(-15,60,11,9,'#e8e4d8');rect(5,60,11,9,'#e8e4d8');rect(-18,68,17,5,'#d7d4cb');rect(3,68,17,5,'#d7d4cb');
// collar
rect(-21,25,10,12,'#f6f0dc');rect(11,25,10,12,'#f6f0dc');rect(-3,36,6,6,'#ecdbab');ctx.restore()}
function drawBackdrop(){rect(0,0,W,H,'#080910');let grd=ctx.createRadialGradient(480,225,20,480,250,430);grd.addColorStop(0,'#1b1b2b');grd.addColorStop(1,'#080910');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
for(let i=0;i<42;i++){let x=(i*173+31)%W,y=(i*97+53)%270;let a=.25+.2*Math.sin(tick*.025+i);ctx.globalAlpha=a;rect(x,y,2,2,i%3?'#aab0d4':'#e5e3d6')}ctx.globalAlpha=1;
// distant pillars
for(let i=0;i<6;i++){let x=i*190-30;rect(x,235,12,160,'#10111a');rect(x+13,255,4,125,'#171824')}
}
function drawTitle(){drawBackdrop();text('A LAST BREATH',480,67,30,colors.white,'center');text('THE MENU IS PART OF THE FIGHT',480,111,10,colors.cyan,'center');
// red slash mark
ctx.strokeStyle='#ff4057';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(420,151);ctx.lineTo(540,151);ctx.stroke();
drawSans(480,222,1.52);text('SANS',480,369,13,colors.white,'center');text('LV 19  •  HP 20 / 20',480,399,9,'#a8a8b7','center');
box(261,448,438,64,'#69697b','#0d0e17',3);text('A familiar smile waits in the dark.',480,467,10,'#dedde3','center');
text('PRESS ENTER TO CONTINUE',480,548,10,colors.gold,'center');}
function drawIntro(){drawBackdrop();drawSans(480,184,1.23);box(105,356,750,153,'#f4f2e9','#06070a',4);text('SANS',132,382,10,colors.cyan);text(lines[dialogue]||lines[2],132,416,13,colors.white);text('Z  /  ENTER  •  NEXT',824,477,8,'#8c8c9b','right');}
function drawHUD(){text('HUMAN',58,48,11,colors.white);text('LV 19',58,69,8,'#9b9bab');text('HP',312,69,9,colors.white);rect(345,68,136,15,'#63202b');rect(345,68,136*(hp/maxHp),15,'#ff4960');text(`${hp} / ${maxHp}`,494,70,9,colors.white);text(`PHASE ${phase}`,900,49,9,phase===2?colors.red:'#aaaabb','right');}
function drawMenu(){drawHUD();drawSans(480,163,1.05);text('SANS',480,252,11,'#b9b9c5','center');text('What will you do?',480,279,10,colors.white,'center');
box(112,327,736,190,'#e9e9e2','#05060a',4);text('sans is staring right through you.',480,361,10,'#bfc0cb','center');const labels=['FIGHT','ACT','ITEM','MERCY'];const xs=[204,389,573,755];for(let i=0;i<4;i++){let col=menu===i?colors.gold:'#f5f0e2';text((menu===i?'▶ ':'  ')+labels[i],xs[i],451,12,col,'center')}
text('Z / ENTER  SELECT     ← →  CHOOSE',480,486,8,'#8b8b99','center');}
function drawEnemyTurn(){drawHUD();box(arena.x,arena.y,arena.w,arena.h,'#f4f2e9','#05060a',4);drawHazards();drawHeart();text('DODGE!',480,266,10,'#a5a5b1','center');text('ARROWS / WASD TO MOVE',480,522,8,'#8b8b9b','center');}
function drawHazards(){for(const b of bullets){if(b.type==='bone'){rect(b.x,b.y,b.w,b.h,b.color||'#f4f2e9');rect(b.x-3,b.y+2,4,Math.max(4,b.h-4),b.color||'#f4f2e9');rect(b.x+b.w-1,b.y+2,4,Math.max(4,b.h-4),b.color||'#f4f2e9')}
else if(b.type==='blaster'){rect(b.x-15,b.y-10,30,20,'#b6b7c8');rect(b.x-9,b.y-5,19,10,'#54566e');rect(b.x-6,b.y-3,13,6,'#ff4c63');if(b.beam>0){rect(arena.x,b.y-9,arena.w,b.beam,'#ff334d');rect(arena.x,b.y-2,arena.w,4,'#fff0ea')}}else{ctx.fillStyle=b.color||colors.cyan;ctx.beginPath();ctx.arc(b.x,b.y,b.r||6,0,Math.PI*2);ctx.fill()}}
for(const b of bones){rect(b.x,b.y,b.w,b.h,'#faf8ed');rect(b.x-3,b.y+2,4,Math.max(5,b.h-4),'#faf8ed')}}
function drawHeart(){ctx.save();ctx.translate(heart.x,heart.y);ctx.rotate(Math.PI/4);rect(-7,-7,14,14,colors.red);rect(-10,-5,9,10,colors.red);rect(-5,-10,10,9,colors.red);if(invuln>0&&Math.floor(tick/4)%2===0)ctx.globalAlpha=.35;ctx.restore();}
function drawBreak(){drawHUD();drawBackgroundFightBox();
text('SANS',480,248,8,'#818191','center');text('oops. did i do that?',480,265,9,'#e7e5df','center');
// pieces
for(const f of fragments){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(tick*.04+f.id)*.2);rect(-11,-11,22,22,'#17111c');rect(-8,-8,16,16,f.got?'#43d9ec':'#ffce57');rect(-5,-5,10,10,'#201e2d');rect(-3,-8,6,5,f.got?'#8effff':'#fff0b0');if(!f.got){glow(f.x,f.y,13,'#ffce57',.45);text('✦',f.x,f.y-26,9,colors.gold,'center')}ctx.restore()}
drawHeart();text(`FIGHT MENU FRAGMENTS   ${collected} / 3`,480,523,9,collected===3?colors.cyan:'#dddce4','center');text('MOVE WITH ARROWS  •  TOUCH THE SHARDS',480,545,7,'#888897','center');
if(collected===3){box(305,454,350,48,colors.cyan,'#07131a',3);text('Z  REASSEMBLE FIGHT',480,470,9,colors.cyan,'center')}}
function drawBackgroundFightBox(){box(arena.x,arena.y,arena.w,arena.h,'#f4f2e9','#07080e',4);for(let i=0;i<8;i++){let x=arena.x+24+i*65,y=arena.y+20+((i*37)%160);ctx.globalAlpha=.16;rect(x,y,2,2,'#d8dcf5')}ctx.globalAlpha=1;}
function drawAttack(){drawHUD();drawSans(480,163,1.05);text('SANS',480,252,11,'#b9b9c5','center');text('Time your strike!',480,279,10,colors.white,'center');box(112,327,736,190,'#e9e9e2','#05060a',4);rect(173,400,614,23,'#262633');rect(173,400,614,3,'#93939e');rect(173,420,614,3,'#93939e');rect(463,395,32,34,'#e64459');rect(attackTarget-2,394,4,35,colors.gold);rect(attackTimer,398,5,27,colors.white);text('Z / ENTER  •  STRIKE',480,469,9,'#9999a8','center')}
function drawRepair(){drawHUD();drawBackgroundFightBox();drawSans(480,164,1.02);text('THE MENU IS COMING BACK...',480,272,9,colors.cyan,'center');for(let i=0;i<3;i++){let x=420+i*45;rect(x,333,28,28,i<collected?colors.cyan:'#252633');rect(x+6,339,16,16,'#11121a')}rect(333,397,294,6,'#282936');rect(333,397,294*(1-restoreTimer/75),6,colors.cyan);text('HOLD IT TOGETHER',480,419,9,'#a7a7b5','center');}
function drawEnding(){drawBackdrop();drawSans(480,200,1.5);if(ending===1){text('...heh.',480,385,22,colors.white,'center');text('you really did it.',480,424,11,'#aaaab8','center');text('THE END  •  Z TO PLAY AGAIN',480,535,9,colors.gold,'center')}else{ text('GAME OVER',480,399,22,colors.red,'center');text('Z TO TRY AGAIN',480,535,9,colors.white,'center')}}
function render(){ctx.clearRect(0,0,W,H);if(shake>0){ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
switch(mode){case'title':drawTitle();break;case'intro':drawIntro();break;case'menu':drawMenu();break;case'attack':drawAttack();break;case'dodge':drawEnemyTurn();break;case'break':drawBreak();break;case'repair':drawRepair();break;case'ending':drawEnding();break}
if(flash>0){ctx.globalAlpha=flash/10;rect(0,0,W,H,'#fff');ctx.globalAlpha=1}if(shake>0){ctx.restore();shake*=.82;if(shake<.2)shake=0}if(mode==='title')hint.textContent='ENTER / Z TO BEGIN  •  ARROWS TO MOVE  •  X TO BACK';else if(mode==='break')hint.textContent='FIGHT IS GONE. FIND ALL THREE GOLD SHARDS.';else hint.textContent='ARROWS / WASD MOVE  •  Z / ENTER SELECT  •  X BACK';}
function startDodge(){mode='dodge';attackTimer=0;playTime=0;heart.x=480;heart.y=390;bullets=[];bones=[];}
function beginBreak(){mode='break';collected=0;heart.x=480;heart.y=390;bullets=[];fragments=[{x:310,y:345,id:0,got:false},{x:640,y:360,id:1,got:false},{x:480,y:456,id:2,got:false}];playTime=0;}
function afterDodge(){turn++;if(turn>=2)phase=2;if(hp<=0){ending=0;mode='ending'}else mode='menu'}
function doAttack(){let delta=Math.abs(attackTimer-attackTarget);attackResult=delta<24?3:delta<65?2:1;score+=attackResult*17;flash=attackResult===3?8:3;shake=attackResult===3?6:2;attackTimer=0;
if(turn===2&&phase===2){beginBreak();return}
if(turn>=4){ending=1;mode='ending';return}startDodge();}
function choose(){if(mode==='title'){mode='intro';return}if(mode==='intro'){dialogue++;if(dialogue>=3){dialogue=0;mode='menu'}return}
if(mode==='menu'){if(menu===0){mode='attack';attackTimer=173;attackTarget=320+Math.random()*320;return}if(menu===1){mode='intro';dialogue=0;lines[0]="he's got no patience for small talk.";lines[1]="you already know what comes next.";lines[2]="back to it, then.";return}if(menu===2){hp=Math.min(maxHp,hp+6);mode='intro';dialogue=0;lines[0]="you ate a butterscotch snack.";lines[1]="your HP was restored a little.";lines[2]="sans watches you quietly.";return}if(menu===3){ending=1;mode='ending';return}}
if(mode==='attack')doAttack();else if(mode==='break'&&collected===3){mode='repair';restoreTimer=75;flash=5}}
function reset(){mode='title';hp=maxHp=20;turn=0;phase=1;menu=0;dialogue=0;ending=0;bullets=[];fragments=[];collected=0;lines[0]="heya. you made it all this way.";lines[1]="i'm impressed. really.";lines[2]="let's see if you can keep it up."}
function keyDown(e){let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','enter'].includes(k))e.preventDefault();keys[k]=true;if(e.repeat)return;
if(k==='z'||k===' '||k==='enter'){if(mode==='ending'){reset();return}choose()}
if(k==='x'||k==='escape'){if(mode==='intro'&&dialogue>0){mode='menu';dialogue=0}else if(mode==='menu')menu=0}
if(mode==='menu'){if(k==='arrowleft'||k==='a')menu=(menu+3)%4;if(k==='arrowright'||k==='d')menu=(menu+1)%4}
}
function keyUp(e){keys[e.key.toLowerCase()]=false}
window.addEventListener('keydown',keyDown);window.addEventListener('keyup',keyUp);window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll('.mobile-controls button').forEach(btn=>{const key=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[key.toLowerCase()]=true;if(key==='z')choose()});for(const ev of ['pointerup','pointercancel','pointerleave'])btn.addEventListener(ev,()=>keys[key.toLowerCase()]=false)});
function addHazard(){let left=arena.x+14,right=arena.x+arena.w-14,top=arena.y+12,bottom=arena.y+arena.h-12;let pattern=(Math.floor(playTime/90)+turn)%4;
if(pattern===0){let y=top+Math.random()*(bottom-top);bullets.push({type:'bone',x:right,y,w:34,h:8,vx:-4.3-turn*.18,vy:0})}
else if(pattern===1){let x=left+Math.random()*(right-left);bullets.push({type:'bone',x,y:top,w:8,h:34,vx:0,vy:3.7+turn*.12})}
else if(pattern===2){bullets.push({type:'blaster',x:right-8,y:top+20+Math.random()*(bottom-top-40),vx:-2.2,beam:0,age:0})}
else{let x=left+Math.random()*(right-left),y=top;bullets.push({type:'orb',x,y,r:6,color:turn%2?colors.cyan:'#ffd05c',vx:(heart.x-x)*.012,vy:3.1})}}
function updateDodge(){playTime++;if(playTime%42===0)addHazard();let speed=3.3;let dx=((keys.arrowright||keys.d)?1:0)-((keys.arrowleft||keys.a)?1:0),dy=((keys.arrowdown||keys.s)?1:0)-((keys.arrowup||keys.w)?1:0);if(dx&&dy){dx*=.707;dy*=.707}heart.x=Math.max(arena.x+17,Math.min(arena.x+arena.w-17,heart.x+dx*speed));heart.y=Math.max(arena.y+17,Math.min(arena.y+arena.h-17,heart.y+dy*speed));
if(invuln>0)invuln--;for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx||0;b.y+=b.vy||0;if(b.type==='blaster'){b.age++;if(b.age===35)b.beam=18;if(b.age>45)b.beam=18;if(b.age>58)b.beam=0;if(b.age>90){bullets.splice(i,1);continue}}else if(b.x<arena.x-45||b.x>arena.x+arena.w+45||b.y>arena.y+arena.h+45){bullets.splice(i,1);continue}
let hit=false;if(b.type==='bone')hit=heart.x>b.x-10&&heart.x<b.x+b.w+8&&heart.y>b.y-9&&heart.y<b.y+b.h+9;else if(b.type==='blaster'&&b.beam)hit=Math.abs(heart.y-b.y)<12;else hit=Math.hypot(heart.x-b.x,heart.y-b.y)<(b.r||7)+8;if(hit&&invuln===0){hp=Math.max(0,hp-2);invuln=42;shake=4;flash=3}}
if(playTime>430||hp<=0)afterDodge();}
function updateBreak(){playTime++;let speed=3.1,dx=((keys.arrowright||keys.d)?1:0)-((keys.arrowleft||keys.a)?1:0),dy=((keys.arrowdown||keys.s)?1:0)-((keys.arrowup||keys.w)?1:0);if(dx&&dy){dx*=.707;dy*=.707}heart.x=Math.max(arena.x+18,Math.min(arena.x+arena.w-18,heart.x+dx*speed));heart.y=Math.max(arena.y+18,Math.min(arena.y+arena.h-18,heart.y+dy*speed));
for(let f of fragments){if(!f.got&&Math.hypot(heart.x-f.x,heart.y-f.y)<25){f.got=true;collected++;flash=4;score+=50}}
if(playTime%76===0){let x=arena.x+30+Math.random()*(arena.w-60);bullets.push({type:'bone',x:arena.x+arena.w-8,y:arena.y+24+Math.random()*(arena.h-48),w:25,h:7,vx:-3.3,vy:0})}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx; if(b.x<arena.x-35)bullets.splice(i,1);else if(invuln===0&&heart.x>b.x-9&&heart.x<b.x+b.w+5&&Math.abs(heart.y-b.y)<13){hp=Math.max(1,hp-1);invuln=48}}
if(invuln>0)invuln--;if(hp<=0){hp=1;}}
function update(){tick++;if(flash>0)flash--;if(mode==='attack'){attackTimer+=8.2;if(attackTimer>787)attackTimer=173}
if(mode==='dodge')updateDodge();if(mode==='break')updateBreak();if(mode==='repair'){restoreTimer--;if(restoreTimer<=0){mode='menu';turn=3;phase=2;bullets=[];}}
render();requestAnimationFrame(update)}
requestAnimationFrame(update);
})();
</script></body></html>
